<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#06140f">
<title>HaloKita Admin</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=Unbounded:wght@600&display=swap">
<!--
  Simpan di folder yang sama dengan index.html (mis. /admin.html).
  Panel ini TANPA login dan TANPA cek admin: langsung terbuka dan membaca/menulis Realtime Database.
  Agar berfungsi, Rules harus mengizinkan akses itu. Jika Rules masih khusus admin, panel hanya bisa
  menulis bila browser sedang login ke HaloKita sebagai admin di domain yang sama.
  Peringatan: Rules yang terbuka untuk umum membuat siapa pun bisa ban, memberi centang, atau mengirim
  notifikasi lewat config Firebase di index.html. Lindungi file ini di sisi server bila memungkinkan.
-->
<style>
:root{--bg:#06140f;--s1:#0b1f17;--s2:#12301f;--s3:#1c4230;--ln:rgba(214,255,190,.11);--tx:#eef5e1;--sub:#86a392;--acc:#c9f73a;--ink:#06140f;--co:#ff6b57;--fd:"Unbounded","Arial Rounded MT Bold",system-ui,sans-serif;--fb:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color-scheme:dark}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font:14px/1.55 var(--fb);min-height:100dvh}
[hidden]{display:none!important}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
h1,h2{font-family:var(--fd);font-weight:600}
h3{font-size:15px}
.f{width:100%;background:var(--s1);border:1px solid var(--ln);border-radius:12px;padding:11px 13px;resize:vertical}
.f::placeholder{color:var(--sub)}
.f:focus{border-color:var(--acc);outline:0}
.b{background:var(--s2);border:1px solid var(--ln);border-radius:99px;padding:7px 14px;font-weight:600;cursor:pointer}
.b:hover{background:var(--s3)}
.b:disabled{opacity:.5;cursor:wait}
.b.p,.seg .b.on{background:var(--acc);color:var(--ink);border-color:var(--acc)}
.b.d{background:none;color:var(--co);border-color:var(--co)}
#app{display:grid;grid-template-columns:220px 1fr}
aside{position:sticky;top:0;height:100dvh;background:var(--s1);border-right:1px solid var(--ln);padding:18px 12px;display:flex;flex-direction:column;gap:14px}
.brand{font:600 15px var(--fd);padding:0 10px}
.brand span{color:var(--acc)}
nav{display:flex;flex-direction:column;gap:2px;flex:1}
nav button{display:flex;justify-content:space-between;align-items:center;gap:8px;background:none;border:0;border-radius:12px;padding:10px 12px;color:var(--sub);font-weight:600;cursor:pointer;text-align:left}
nav button:hover{background:var(--s2);color:var(--tx)}
nav button.on{background:var(--acc);color:var(--ink)}
.n{background:var(--co);color:var(--ink);border-radius:99px;padding:0 7px;font-size:12px;font-weight:700}
main{padding:28px;max-width:960px;width:100%}
main h2{font-size:20px;margin-bottom:18px}
.box{display:grid;gap:10px}
.sts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.st{background:var(--s1);border:1px solid var(--ln);border-radius:16px;padding:16px;display:grid;gap:2px;text-align:left;cursor:pointer}
.st:hover{border-color:var(--acc)}
.st b{font:600 26px var(--fd)}
.st span{color:var(--sub)}
.row{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:start;background:var(--s1);border:1px solid var(--ln);border-radius:16px;padding:14px}
.av{width:40px;height:40px;border-radius:50%;background:var(--s3);display:grid;place-items:center;font-weight:700;color:var(--acc)}
.m{min-width:0}
.m b{overflow-wrap:anywhere}
.m small{display:block;color:var(--sub)}
.m p{margin-top:6px;white-space:pre-wrap;overflow-wrap:anywhere}
.tag{font-size:12px;font-weight:700;border-radius:99px;padding:1px 8px;margin-left:8px;background:var(--s3)}
.tag.ok{background:var(--acc);color:var(--ink)}
.tag.bad{background:var(--co);color:var(--ink)}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.bar{display:flex;gap:8px;margin-bottom:14px}
.card{background:var(--s1);border:1px solid var(--ln);border-radius:16px;padding:16px;display:grid;gap:10px;margin-bottom:16px}
.seg{display:flex;gap:6px}
.sec{margin:6px 0 10px}
.hint,.empty{color:var(--sub)}
dialog{background:var(--s1);color:var(--tx);border:1px solid var(--ln);border-radius:18px;padding:20px;width:min(420px,92vw);margin:auto}
dialog::backdrop{background:rgba(0,0,0,.65)}
dialog form{display:grid;gap:12px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--tx);color:var(--ink);padding:10px 16px;border-radius:99px;font-weight:600;z-index:9;max-width:92vw}
@media(max-width:760px){
#app{display:block}
aside{position:static;height:auto;flex-direction:row;align-items:center;overflow-x:auto;padding:10px;border:0;border-bottom:1px solid var(--ln)}
.brand{display:none}
nav{flex-direction:row;flex:none}
nav button{white-space:nowrap}
main{padding:16px}
.row{grid-template-columns:40px 1fr}
.acts{grid-column:1/-1;justify-content:flex-start}
}
</style>
</head>
<body>
<div id="app">
  <aside><div class="brand">Halo<span>Kita</span> Admin</div><nav id="nv"></nav></aside>
  <main id="v"></main>
</div>

<dialog id="dlg">
  <form method="dialog">
    <h3 id="dt"></h3>
    <textarea class="f" id="di" rows="3" maxlength="300"></textarea>
    <div class="acts"><button class="b" value="no" formnovalidate>Batal</button><button class="b p" value="ok">Lanjut</button></div>
  </form>
</dialog>
<div id="toast" role="status" hidden></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getDatabase,ref,get,set,update,push,remove,onValue,query,limitToLast,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const app = initializeApp({
  apiKey: "AIzaSyBEPzUM9EresZ-yvphzDusVs7AUqdLuCNQ",
  authDomain: "mygame-68b24.firebaseapp.com",
  databaseURL: "https://mygame-68b24-default-rtdb.firebaseio.com",
  projectId: "mygame-68b24",
  storageBucket: "mygame-68b24.firebasestorage.app",
  messagingSenderId: "1003182873390",
  appId: "1:1003182873390:web:aabf3248f759cbc9d678bf"
});
const auth = getAuth(app), db = getDatabase(app);

/* ---------- util ---------- */
const $ = s => document.querySelector(s);
const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
const norm = s => s.trim().toLowerCase().replace(/^@/, '');
const fd = t => t ? new Date(t).toLocaleString('id-ID', {day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit'}) : '-';
const arr = o => Object.entries(o || {}).map(([k, v]) => ({...v, k}));
const S = {users: {}, bans: {}, vf: {}, reps: {}, apps: {}, news: {}, more: false}, V = {cur: 'home', q: ''};
let subs = [], tt;

const toast = m => { const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => t.hidden = true, 3200); };
const btn = (t, c, f) => {
  const b = el('button', 'b ' + (c || ''), t); b.type = 'button';
  b.onclick = async () => { b.disabled = true; try { await f(); } catch (e) { toast('Gagal: ' + (e.code || e.message)); } b.disabled = false; };
  return b;
};
const ask = (title, ph, req, def) => new Promise(res => {
  const d = $('#dlg'), i = $('#di');
  $('#dt').textContent = title; i.placeholder = ph; i.value = def || ''; i.required = !!req; d.returnValue = '';
  d.onclose = () => res(d.returnValue == 'ok' ? i.value.trim() : null);
  d.showModal(); i.focus();
});
function row(o) {
  const r = el('div', 'row'), m = el('div', 'm'), t = el('b', '', o.t), a = el('div', 'acts');
  (o.tags || []).forEach(g => g && t.append(el('span', 'tag ' + g[1], g[0])));
  m.append(t, el('small', '', o.s || ''));
  if (o.p) m.append(el('p', '', o.p));
  a.append(...(o.a || []));
  r.append(el('div', 'av', (o.t || '?')[0].toUpperCase()), m, a);
  return r;
}
const fill = (items, msg) => V.box.replaceChildren(...(items.length ? items : [el('p', 'empty', msg)]));

/* ---------- aksi ---------- */
const ban = (uid, reason) => update(ref(db), {['bans/' + uid]: {reason, ts: serverTimestamp(), by: auth.currentUser?.uid || 'admin'}}).then(() => toast('Pengguna di-ban'));
const unban = uid => update(ref(db), {['bans/' + uid]: null, ['appeals/' + uid]: null}).then(() => toast('Ban dibuka'));
const askBan = (uid, who, def) => ask('Ban ' + who, 'Alasan (tampil ke pengguna)', 1, def).then(r => r && ban(uid, r));

/* ---------- halaman ---------- */
const NM = {home: 'Ringkasan', users: 'Pengguna', reports: 'Laporan', apps: 'Banding', bc: 'Siaran', cfg: 'Pengaturan'};
const R = {
  home: {upd() {
    const us = Object.values(S.users), open = arr(S.reps).filter(r => r.st == 'open').length, pend = Object.keys(S.apps).length;
    const st = [
      [us.length + (S.more ? '+' : ''), 'Pengguna dimuat', 'users'], [us.filter(u => u.online === true).length, 'Online sekarang', 'users'],
      [open, 'Laporan menunggu', 'reports'], [pend, 'Banding menunggu', 'apps'],
      [Object.keys(S.bans).length, 'Pengguna di-ban', 'users'], [Object.keys(S.vf).length, 'Terverifikasi', 'users']
    ];
    V.box.className = 'sts';
    V.box.replaceChildren(...st.map(([n, l, v]) => { const b = el('button', 'st'); b.append(el('b', '', n), el('span', '', l)); b.onclick = () => go(v); return b; }));
  }},

  users: {
    init(r) {
      const bar = el('div', 'bar'), i = el('input', 'f');
      i.placeholder = 'Cari nama, @username, atau UID (Enter = cari username persis)'; i.value = V.q;
      i.oninput = () => { V.q = i.value; R.users.upd(); };
      i.onkeydown = async e => {
        if (e.key != 'Enter' || !norm(i.value)) return;
        try {
          const s = await get(ref(db, 'usernames/' + norm(i.value)));
          if (!s.exists()) return toast('Username tidak ditemukan');
          const u = (await get(ref(db, 'users/' + s.val()))).val();
          if (u) { S.users[s.val()] = u; R.users.upd(); }
        } catch (x) { toast('Gagal: ' + x.code); }
      };
      bar.append(i, btn('Muat ulang', '', loadUsers)); r.append(bar);
    },
    upd() {
      const q = norm(V.q); let a = arr(S.users);
      if (q) a = a.filter(u => [u.name, u.username, u.k].some(x => String(x || '').toLowerCase().includes(q)));
      a.sort((x, y) => (y.online === true) - (x.online === true) || String(x.name || '').localeCompare(String(y.name || '')));
      const f = a.slice(0, 100).map(u => {
        const b = S.bans[u.k], v = S.vf[u.k];
        return row({
          t: u.name || u.username || u.k,
          s: '@' + (u.username || '?') + ' · ' + (u.online === true ? 'online' : u.lastSeen ? 'terakhir ' + fd(u.lastSeen) : 'offline'),
          tags: [v && ['Terverifikasi', 'ok'], b && ['Di-ban', 'bad']],
          a: [
            btn(v ? 'Cabut centang' : 'Beri centang', '', () => update(ref(db), {['verified/' + u.k]: v ? null : true})),
            b ? btn('Buka ban', '', () => unban(u.k)) : btn('Ban', 'd', () => askBan(u.k, '@' + u.username))
          ]
        });
      });
      if (a.length > 100) f.push(el('p', 'hint', 'Menampilkan 100 dari ' + a.length + '. Persempit pencarian.'));
      if (S.more) f.push(el('p', 'hint', 'Hanya 300 pengguna yang dimuat. Untuk yang lain, cari username persis lalu tekan Enter.'));
      fill(f, 'Tidak ada pengguna yang cocok.');
    }
  },

  reports: {upd() {
    const a = arr(S.reps).sort((x, y) => (x.st == 'open' ? 0 : 1) - (y.st == 'open' ? 0 : 1) || (y.ts || 0) - (x.ts || 0));
    fill(a.map(r => {
      const o = r.st == 'open', bn = S.bans[r.target];
      return row({
        t: r.targetName || r.targetUser || r.target || '?',
        s: 'Dilaporkan oleh @' + (r.byUser || '?') + ' · ' + fd(r.ts), p: r.reason,
        tags: [o ? ['Menunggu', ''] : ['Selesai', 'ok'], bn && ['Di-ban', 'bad']],
        a: [
          o && btn('Tandai selesai', 'p', () => update(ref(db), {['reports/' + r.k + '/st']: 'done'})),
          !bn && r.target && btn('Ban target', 'd', () => askBan(r.target, '@' + (r.targetUser || '?'), 'Melanggar ketentuan penggunaan HaloKita.'))
        ].filter(Boolean)
      });
    }), 'Belum ada laporan.');
  }},

  apps: {upd() {
    fill(Object.entries(S.apps).sort((x, y) => (y[1].ts || 0) - (x[1].ts || 0)).map(([uid, a]) => row({
      t: a.name || a.user || uid, s: '@' + (a.user || '?') + ' · ' + fd(a.ts),
      p: 'Alasan ban: ' + (S.bans[uid]?.reason || '-') + '\nBanding: ' + a.text,
      a: [
        btn('Terima & buka ban', 'p', () => unban(uid)),
        btn('Tolak', 'd', async () => {
          const n = await ask('Tolak banding', 'Catatan untuk pengguna (opsional)', 0);
          if (n === null) return;
          const u = {['appeals/' + uid]: null};
          if (S.bans[uid]) u['bans/' + uid + '/rej'] = {note: n, ts: serverTimestamp()};
          await update(ref(db), u); toast('Banding ditolak');
        })
      ]
    })), 'Tidak ada banding.');
  }},

  bc: {
    init(r) {
      let to = 'all';
      const c1 = el('div', 'card'), sg = el('div', 'seg'), un = el('input', 'f'), ti = el('input', 'f'), tx = el('textarea', 'f');
      un.placeholder = 'Username penerima (tanpa @)'; un.hidden = true;
      ti.placeholder = 'Judul (opsional)'; ti.maxLength = 60;
      tx.placeholder = 'Isi notifikasi'; tx.maxLength = 300; tx.rows = 3;
      [['all', 'Semua pengguna'], ['one', 'Satu pengguna']].forEach(([k, l]) => {
        const b = el('button', 'b' + (k == to ? ' on' : ''), l); b.type = 'button';
        b.onclick = () => { to = k; un.hidden = k == 'all'; [...sg.children].forEach(x => x.classList.toggle('on', x == b)); };
        sg.append(b);
      });
      c1.append(el('h3', '', 'Kirim notifikasi'), sg, un, ti, tx, btn('Kirim', 'p', async () => {
        const x = tx.value.trim(); if (x.length < 3) return toast('Isi pesan dulu');
        const d = {t: ti.value.trim(), x, ts: serverTimestamp(), by: auth.currentUser?.uid || 'admin'};
        if (to == 'all') { if (!confirm('Kirim ke semua pengguna?')) return; await push(ref(db, 'notifAll'), d); }
        else {
          const s = await get(ref(db, 'usernames/' + norm(un.value)));
          if (!s.exists()) return toast('Username tidak ditemukan');
          await push(ref(db, 'notif/' + s.val()), d);
        }
        tx.value = ti.value = ''; toast('Notifikasi terkirim');
      }));

      const c2 = el('div', 'card'), nt = el('textarea', 'f'), ni = el('input', 'f');
      nt.placeholder = 'Isi berita'; nt.rows = 3; nt.maxLength = 500;
      ni.placeholder = 'Link gambar (opsional, https://…)';
      c2.append(el('h3', '', 'Terbitkan berita'), nt, ni, btn('Terbitkan', 'p', async () => {
        const t = nt.value.trim(), im = ni.value.trim();
        if (t.length < 3) return toast('Tulis isi berita');
        if (im && !/^https:\/\//.test(im)) return toast('Link gambar harus diawali https://');
        await push(ref(db, 'news'), {text: t, ...(im && {img: im}), ts: serverTimestamp()});
        nt.value = ni.value = ''; toast('Berita terbit');
      }));
      r.append(c1, c2, el('h3', 'sec', 'Berita terbaru'));
    },
    upd() {
      fill(arr(S.news).sort((x, y) => (y.ts || 0) - (x.ts || 0)).map(n => row({
        t: (n.text || '').slice(0, 80) || '(tanpa teks)', s: fd(n.ts),
        a: [btn('Hapus', 'd', async () => { if (confirm('Hapus berita ini?')) { await remove(ref(db, 'news/' + n.k)); toast('Berita dihapus'); } })]
      })), 'Belum ada berita.');
    }
  },

  cfg: {init(r) {
    const c = el('div', 'card'), i = el('input', 'f'); i.type = 'number'; i.min = 0; i.step = 1;
    get(ref(db, 'hkcfg/refLimit')).then(s => { i.value = typeof s.val() == 'number' ? s.val() : 1; }).catch(() => {});
    c.append(
      el('h3', '', 'Batas kode referral'),
      el('p', 'hint', 'Berapa akun yang boleh memakai kode referral dari satu perangkat atau jaringan. Isi 0 untuk tanpa batas. Jika belum diatur, HaloKita memakai 1.'),
      i, btn('Simpan', 'p', async () => { await set(ref(db, 'hkcfg/refLimit'), Math.max(0, Math.floor(+i.value || 0))); toast('Tersimpan'); })
    );
    r.append(c);
  }}
};

function go(k) {
  V.cur = k;
  document.querySelectorAll('#nv [data-v]').forEach(b => b.classList.toggle('on', b.dataset.v == k));
  const v = $('#v'); v.replaceChildren(el('h2', '', NM[k])); V.box = el('div', 'box');
  R[k].init?.(v); v.append(V.box); R[k].upd?.();
}
function paint() {
  for (const [k, n] of [['reports', arr(S.reps).filter(r => r.st == 'open').length], ['apps', Object.keys(S.apps).length]]) {
    const b = $('#n-' + k); b.textContent = n; b.hidden = !n;
  }
  R[V.cur].upd?.();
}

/* ---------- navigasi ---------- */
for (const k in NM) {
  const b = el('button', '', NM[k]); b.dataset.v = k; b.onclick = () => go(k);
  if (k == 'reports' || k == 'apps') { const n = el('span', 'n'); n.id = 'n-' + k; n.hidden = true; b.append(n); }
  $('#nv').append(b);
}

/* ---------- data ---------- */
const L = (r, k) => subs.push(onValue(r, s => { S[k] = s.val() || {}; paint(); }, e => toast('Tidak bisa membaca ' + k + ': ' + e.code)));
async function loadUsers() {
  try {
    S.users = (await get(query(ref(db, 'users'), limitToLast(300)))).val() || {};
    S.more = Object.keys(S.users).length >= 300; paint();
  } catch (e) { toast('Tidak bisa membaca users: ' + e.code); }
}

/* ---------- mulai (tanpa login) ---------- */
L(ref(db, 'bans'), 'bans'); L(ref(db, 'verified'), 'vf'); L(query(ref(db, 'reports'), limitToLast(150)), 'reps');
L(ref(db, 'appeals'), 'apps'); L(query(ref(db, 'news'), limitToLast(10)), 'news');
loadUsers(); go(V.cur);
</script>
</body>
</html>
