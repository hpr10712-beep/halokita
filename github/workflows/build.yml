name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Siapkan project
        run: |
          mkdir www
          python3 - <<'EOF'
          s = open('index.html', encoding='utf-8').read()
          a = "onAuthStateChanged(auth, u => { if (!reg && u) start(u.uid).finally(hideSplash); else hideSplash(); });"
          assert a in s, 'baris acuan tidak ditemukan'
          push = """
          let pushOn = false;
          onAuthStateChanged(auth, async u => {
            const P = window.Capacitor?.Plugins?.PushNotifications;
            if (!u || !P || pushOn) return;
            try {
              const p = await P.requestPermissions();
              if (p.receive !== 'granted') return;
              pushOn = true;
              P.addListener('registration', t => update(ref(db, 'users/' + u.uid), {fcmToken: t.value}));
              await P.register();
            } catch (e) {}
          });"""
          open('www/index.html', 'w', encoding='utf-8').write(s.replace(a, a + push, 1))
          EOF
          echo '{"appId":"com.halokita.app","appName":"HaloKita","webDir":"www"}' > capacitor.config.json
          npm init -y
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/push-notifications@7
          npx cap add android
          cp google-services.json android/app/
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/></manifest>#' android/app/src/main/AndroidManifest.xml
          npx cap sync android
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: HaloKita-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
